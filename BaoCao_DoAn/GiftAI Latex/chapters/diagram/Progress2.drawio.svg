<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 530" width="600" height="530">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <style>
      .box {
        fill: #ffffff;
        stroke: #000000;
        stroke-width: 1.5;
      }
      .text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #000000;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .arrow-line {
        stroke: #000000;
        stroke-width: 1.5;
        fill: none;
      }
    </style>
  </defs>

  <!-- Step 1 -->
  <rect class="box" x="40" y="25" width="520" height="46" />
  <text class="text" x="300" y="48">Bước 1: Chọn sản phẩm ưng ý từ kết quả gợi ý AI</text>

  <!-- Arrow 1 -> 2 -->
  <line class="arrow-line" x1="300" y1="71" x2="300" y2="109" marker-end="url(#arrow)" />

  <!-- Step 2 -->
  <rect class="box" x="40" y="110" width="520" height="46" />
  <text class="text" x="300" y="133">Bước 2: Viết tâm thư nhắn gửi &amp; Chọn thiệp chúc mừng</text>

  <!-- Arrow 2 -> 3 -->
  <line class="arrow-line" x1="300" y1="156" x2="300" y2="194" marker-end="url(#arrow)" />

  <!-- Step 3 -->
  <rect class="box" x="40" y="195" width="520" height="46" />
  <text class="text" x="300" y="218">Bước 3: Thiết lập thời điểm mở khóa (open_date)</text>

  <!-- Arrow 3 -> 4 -->
  <line class="arrow-line" x1="300" y1="241" x2="300" y2="279" marker-end="url(#arrow)" />

  <!-- Step 4 -->
  <rect class="box" x="40" y="280" width="520" height="46" />
  <text class="text" x="300" y="303">Bước 4: Backend sinh mã độc bản ngẫu nhiên MEM-XXXXXX</text>

  <!-- Arrow 4 -> 5 -->
  <line class="arrow-line" x1="300" y1="326" x2="300" y2="364" marker-end="url(#arrow)" />

  <!-- Step 5 -->
  <rect class="box" x="40" y="365" width="520" height="46" />
  <text class="text" x="300" y="388">Bước 5: Lưu dữ liệu an toàn vào bảng memory_boxes trên TiDB Cloud</text>

  <!-- Arrow 5 -> 6 -->
  <line class="arrow-line" x1="300" y1="411" x2="300" y2="449" marker-end="url(#arrow)" />

  <!-- Step 6 -->
  <rect class="box" x="40" y="450" width="520" height="46" />
  <text class="text" x="300" y="473">Bước 6: Tạo liên kết bí mật &amp; Hỗ trợ sao chép gửi qua Zalo/Facebook</text>
</svg>